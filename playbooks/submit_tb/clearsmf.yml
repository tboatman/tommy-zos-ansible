---
- name: Collect the hosts
  hosts: all
  collections:
    - ibm.ibm_zos_core

  environment: "{{ environment_vars }}"

  tasks:

    - name: Clear SMFDUMPS
      zos_operator:
        cmd: "\\$pojq,jm=SMFDUMPS"
      register: content

    - name: Response for command 
      debug:
        msg: "{{ content }}"

    - name: Clear SMFCLEAR
      zos_operator:
        cmd: "\\$pojq,jm=SMFCLEAR"
      register: content

    - name: Response for command 
      debug:
        msg: "{{ content }}"

requires_collection:
    - ibm_zos_core:
          name: "ibm_zos_core"
          version: "1.12.0"