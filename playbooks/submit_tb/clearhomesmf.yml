---
- name: Collect the hosts
  hosts: all
  environment: "{{env_vars}}"
  collections:
    - ibm.ibm_zos_core
  gather_facts: False
 
  tasks:
    - name: Clear SMFCLEAR
      zos_operator:
        cmd: "\\$pojq,jm=SMFCLEAR"
      register: content

    - name: Clear DEFRAG
      zos_operator:
        cmd: "\\$pojq,jm=DEFRAG"
      register: content

    - name: Clear CTMTDAY
      zos_operator:
        cmd: "\\$pojq,jm=CTMTDAY"
      register: content

    - name: Clear CTDNDAY
      zos_operator:
        cmd: "\\$pojq,jm=CTDNDAY"
      register: content

    - name: Clear IOALDNRS
      zos_operator:
        cmd: "\\$pojq,jm=IOALDNRS"
      register: content

    - name: Clear IOAJSA
      zos_operator:
        cmd: "\\$pojq,jm=IOAJSA"
      register: content

    - name: Clear IOACLCND
      zos_operator:
        cmd: "\\$pojq,jm=IOACLCND"
      register: content

    - name: Clear DAILYPRD
      zos_operator:
        cmd: "\\$pojq,jm=DAILYPRD"
      register: content

    - name: Clear DAILYSYS
      zos_operator:
        cmd: "\\$pojq,jm=DAILYSYS"
      register: content

    - name: Clear ISPWPSX
      zos_operator:
        cmd: "\\$pojq,jm=ISPWPSX"
      register: content

    - name: Clear TSO Users
      zos_operator:
        cmd: "\\$pt1-9999"
      register: content